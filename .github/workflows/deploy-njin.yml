# Managed by njin-supervisor — do not edit by hand, changes will be overwritten on reconnect.
name: Deploy to njin
on:
  push:
    branches: [ "main" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx njin build:worker
      - run: tar czf build.tar.gz -C out worker.js public src/views _admin
      - run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.NJIN_DEPLOY_TOKEN }}" \
            -H "X-Commit-Sha: ${{ github.sha }}" \
            --data-binary @build.tar.gz \
            "https://supervisor.jadiweb.id/api/deploy/j3companyid-com"
